<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>国内多源地图 · Leaflet</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== 顶部控制栏（固定，可横向滚动） ===== */
    #control-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 1px 10px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #control-bar::-webkit-scrollbar { display: none; }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .bar-divider {
      width: 1px;
      height: 24px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
      margin: 0 2px;
    }
    .bar-label {
      font-size: 12px;
      font-weight: 700;
      color: #95a5a6;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      user-select: none;
    }

    /* ===== 瓦片按钮 ===== */
    .tile-btn {
      flex-shrink: 0;
      padding: 7px 15px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.75);
      color: #444;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      white-space: nowrap;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .tile-btn:hover {
      background: rgba(52, 152, 219, 0.1);
      border-color: #3498db;
      color: #3498db;
    }
    .tile-btn.active {
      background: #3498db;
      border-color: #3498db;
      color: #fff;
      box-shadow: 0 2px 10px rgba(52, 152, 219, 0.35);
    }
    .tile-btn:active { transform: scale(0.95); }

    /* 风格子按钮（小一号，圆角略方） */
    .style-btn {
      padding: 5px 11px;
      font-size: 12px;
      min-height: 30px;
      border-radius: 8px;
      border-color: rgba(0,0,0,0.1);
      background: rgba(245, 245, 245, 0.9);
    }
    .style-btn.active {
      background: #e67e22;
      border-color: #e67e22;
      box-shadow: 0 2px 8px rgba(230, 126, 34, 0.35);
    }

    /* ===== 地图 ===== */
    #map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* 修正 Leaflet 控件位置，避开顶部栏 */
    .leaflet-top { top: 60px !important; }
    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(255,255,255,0.8) !important;
      padding: 2px 6px !important;
      border-radius: 4px 0 0 0 !important;
    }

    /* ===== 移动端 / 平板适配 ===== */
    @media (max-width: 768px) {
      #control-bar { padding: 8px 10px; gap: 6px; }
      .tile-btn { padding: 6px 12px; font-size: 12px; min-height: 34px; }
      .style-btn { padding: 4px 9px; font-size: 11px; min-height: 28px; }
      .bar-label { font-size: 11px; }
      .leaflet-top { top: 54px !important; }
    }
    @media (max-width: 480px) {
      #control-bar { gap: 5px; }
      .bar-label { display: none; }
    }
    @media (min-width: 1024px) and (orientation: landscape) {
      #control-bar { padding: 12px 22px; gap: 12px; }
      .tile-btn { padding: 8px 18px; font-size: 14px; min-height: 40px; }
      .style-btn { padding: 6px 14px; font-size: 13px; min-height: 34px; }
      .leaflet-top { top: 68px !important; }
    }

    /* 深色模式 */
    @media (prefers-color-scheme: dark) {
      #control-bar {
        background: rgba(28, 28, 38, 0.92);
        border-bottom-color: rgba(255, 255, 255, 0.08);
      }
      .bar-label { color: #7f8c8d; }
      .tile-btn {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: #ccc;
      }
      .tile-btn:hover {
        background: rgba(52, 152, 219, 0.2);
        border-color: #5dade2; color: #5dade2;
      }
      .tile-btn.active { background: #2980b9; border-color: #2980b9; }
      .style-btn { background: rgba(255,255,255,0.06); }
      .style-btn.active { background: #d35400; border-color: #d35400; }
      .bar-divider { background: rgba(255,255,255,0.1); }
      .leaflet-control-attribution { background: rgba(0,0,0,0.6) !important; color: #aaa !important; }
      .leaflet-control-attribution a { color: #5dade2 !important; }
    }
  </style>
</head>
<body>

<!-- ========== 顶部控制栏 ========== -->
<div id="control-bar">

  <!-- 主瓦片源 -->
  <div class="bar-group">
    <span class="bar-label">瓦片源</span>
    <button class="tile-btn active" data-provider="amap">高德地图</button>
    <button class="tile-btn" data-provider="tencent">腾讯地图</button>
    <button class="tile-btn" data-provider="tianditu">天地图</button>
  </div>

  <div class="bar-divider"></div>

  <!-- 高德风格开关 -->
  <div class="bar-group" id="style-group-amap">
    <button class="style-btn active" data-amap-style="normal">标准</button>
    <button class="style-btn" data-amap-style="satellite">卫星</button>
    <button class="style-btn" data-amap-style="hybrid">卫星+路网</button>
  </div>

  <!-- 腾讯风格开关（默认隐藏） -->
  <div class="bar-group" id="style-group-tencent" style="display:none;">
    <button class="style-btn active" data-tencent-style="normal">标准</button>
    <button class="style-btn" data-tencent-style="satellite">卫星</button>
  </div>

  <!-- 天地图风格开关（默认隐藏） -->
  <div class="bar-group" id="style-group-tianditu" style="display:none;">
    <button class="style-btn active" data-tianditu-style="vector">矢量</button>
    <button class="style-btn" data-tianditu-style="imagery">影像</button>
    <button class="style-btn" data-tianditu-style="terrain">地形</button>
  </div>

</div>

<!-- ========== 地图容器 ========== -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- ========== Leaflet.ChineseTmsProviders（可选，用于坐标纠正；也可手动处理） ========== -->
<!-- 如果你需要叠加 Marker 且要求高精度，建议引入此插件；仅浏览底图可不引 -->
<!-- <script src="https://cdn.jsdelivr.net/npm/leaflet.chinatmsproviders@2.0.3/src/leaflet.ChineseTmsProviders.js"></script> -->

<script>
/* ================================================================
   一、瓦片源配置
   ================================================================ */
const AMAP_SUBDOMAINS = ['1','2','3','4'];

// 高德 —— 同一服务三种风格，全部免密钥
const amapLayers = {
  normal: L.tileLayer(
    'https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7',
    { subdomains: AMAP_SUBDOMAINS, maxZoom: 18, attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>' }
  ),
  satellite: L.tileLayer(
    'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
    { subdomains: AMAP_SUBDOMAINS, maxZoom: 18, attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>' }
  ),
  hybrid: L.layerGroup([
    L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      { subdomains: AMAP_SUBDOMAINS, maxZoom: 18 }
    ),
    L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}&scl=1',
      { subdomains: AMAP_SUBDOMAINS, maxZoom: 18 }
    )
  ])
};

// 腾讯 —— 注意 y 取反
const tencentLayers = {
  normal: L.tileLayer(
    'https://rt{s}.map.gtimg.com/realtimerender?z={z}&x={x}&y={-y}&type=vector&style=0',
    { subdomains: '0123', maxZoom: 18, attribution: '&copy; <a href="https://map.qq.com/">腾讯地图</a>' }
  ),
  satellite: L.tileLayer(
    'https://p{s}.map.gtimg.com/sateTiles/{z}/{x}/{y}.jpg',
    { subdomains: '0123', maxZoom: 18, attribution: '&copy; <a href="https://map.qq.com/">腾讯地图</a>' }
  )
};

// 天地图 —— 需替换 tk 为你在 lbs.tianditu.gov.cn 申请的免费 Key
const TIANDITU_KEY = 'YOUR_TIANDITU_KEY'; // ← 请替换
const tiandituLayers = {
  vector: L.layerGroup([
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    ),
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    )
  ]),
  imagery: L.layerGroup([
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    ),
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/cia_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    )
  ]),
  terrain: L.layerGroup([
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/ter_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ter&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    ),
    L.tileLayer(
      `https://t{s}.tianditu.gov.cn/cta_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cta&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`,
      { subdomains: '01234567', maxZoom: 18 }
    )
  ])
};

/* ================================================================
   二、状态管理
   ================================================================ */
let currentProvider = 'amap';          // amap | tencent | tianditu
let currentAmapStyle = 'normal';
let currentTencentStyle = 'normal';
let currentTiandituStyle = 'vector';
let activeLayer = null;                // 当前挂载到地图上的图层

/* 根据当前 provider + style 获取应显示的 Layer */
function getTargetLayer() {
  if (currentProvider === 'amap')      return amapLayers[currentAmapStyle];
  if (currentProvider === 'tencent')   return tencentLayers[currentTencentStyle];
  if (currentProvider === 'tianditu')  return tiandituLayers[currentTiandituStyle];
  return amapLayers.normal;
}

/* 切换图层 */
function switchLayer() {
  const target = getTargetLayer();
  if (activeLayer && map.hasLayer(activeLayer)) map.removeLayer(activeLayer);
  target.addTo(map);
  activeLayer = target;
}

/* 显示/隐藏风格子栏 */
function updateStyleBarVisibility() {
  document.getElementById('style-group-amap').style.display     = currentProvider === 'amap'     ? 'flex' : 'none';
  document.getElementById('style-group-tencent').style.display  = currentProvider === 'tencent'  ? 'flex' : 'none';
  document.getElementById('style-group-tianditu').style.display = currentProvider === 'tianditu' ? 'flex' : 'none';
}

/* ================================================================
   三、初始化地图
   ================================================================ */
const map = L.map('map', {
  center: [35.86, 104.19],  // 中国地理中心附近
  zoom: 5,
  layers: [amapLayers.normal],  // 默认高德标准
  zoomControl: false,
  attributionControl: true
});
activeLayer = amapLayers.normal;

L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

/* ================================================================
   四、事件绑定
   ================================================================ */

/* --- 主瓦片源切换 --- */
document.querySelectorAll('.tile-btn[data-provider]').forEach(btn => {
  btn.addEventListener('click', function () {
    const provider = this.dataset.provider;
    if (provider === currentProvider) return;

    currentProvider = provider;
    document.querySelectorAll('.tile-btn[data-provider]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');

    updateStyleBarVisibility();
    switchLayer();

    if (navigator.vibrate) navigator.vibrate(8);
  });
});

/* --- 高德风格切换 --- */
document.querySelectorAll('.style-btn[data-amap-style]').forEach(btn => {
  btn.addEventListener('click', function () {
    const style = this.dataset.amapStyle;
    if (style === currentAmapStyle) return;
    currentAmapStyle = style;

    document.querySelectorAll('.style-btn[data-amap-style]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');

    if (currentProvider === 'amap') switchLayer();
    if (navigator.vibrate) navigator.vibrate(8);
  });
});

/* --- 腾讯风格切换 --- */
document.querySelectorAll('.style-btn[data-tencent-style]').forEach(btn => {
  btn.addEventListener('click', function () {
    const style = this.dataset.tencentStyle;
    if (style === currentTencentStyle) return;
    currentTencentStyle = style;

    document.querySelectorAll('.style-btn[data-tencent-style]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');

    if (currentProvider === 'tencent') switchLayer();
    if (navigator.vibrate) navigator.vibrate(8);
  });
});

/* --- 天地图风格切换 --- */
document.querySelectorAll('.style-btn[data-tianditu-style]').forEach(btn => {
  btn.addEventListener('click', function () {
    const style = this.dataset.tiandituStyle;
    if (style === currentTiandituStyle) return;
    currentTiandituStyle = style;

    document.querySelectorAll('.style-btn[data-tianditu-style]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');

    if (currentProvider === 'tianditu') switchLayer();
    if (navigator.vibrate) navigator.vibrate(8);
  });
});

/* ================================================================
   五、响应式刷新
   ================================================================ */
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));

/* ================================================================
   六、趣味交互：点击地图显示坐标
   ================================================================ */
const popup = L.popup();
map.on('click', function (e) {
  popup
    .setLatLng(e.latlng)
    .setContent(
      `<div style="font-size:13px;line-height:1.7;min-width:140px;">
        <b>📍 位置</b><br>
        纬度：${e.latlng.lat.toFixed(5)}<br>
        经度：${e.latlng.lng.toFixed(5)}
      </div>`
    )
    .openOn(map);
});

/* 初始状态 */
updateStyleBarVisibility();
</script>
</body>
</html>
